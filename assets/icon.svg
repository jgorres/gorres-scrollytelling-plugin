<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <style>
    /* Two scenes take turns: a text box scrolls up across the stage, then the
       medium behind it changes and the next box starts at the bottom. */
    .box { animation: 6s linear infinite; }
    .box-a { animation-name: box-a; }
    .box-b { animation-name: box-b; }
    .scene { animation: 6s linear infinite; }
    .scene-a { animation-name: scene-a; }
    .scene-b { opacity: 0; animation-name: scene-b; }
    @keyframes box-a {
      0%      { transform: translateY(190px); }
      41.67%  { transform: translateY(-170px); }
      41.68%, 100% { transform: translateY(190px); }
    }
    @keyframes box-b {
      0%, 50% { transform: translateY(190px); }
      91.67%  { transform: translateY(-170px); }
      91.68%, 100% { transform: translateY(190px); }
    }
    @keyframes scene-a {
      0%, 41.67% { opacity: 1; }
      48.33%, 91.67% { opacity: 0; }
      98.33%, 100% { opacity: 1; }
    }
    @keyframes scene-b {
      0%, 41.67% { opacity: 0; }
      48.33%, 91.67% { opacity: 1; }
      98.33%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .box, .scene { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <clipPath id="stage"><rect x="32" y="40" width="192" height="176" rx="18"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <g clip-path="url(#stage)">
    <g class="scene scene-b">
      <rect x="32" y="40" width="192" height="176" fill="url(#dusk)"/>
      <circle cx="84" cy="88" r="18" fill="#fef9c3" opacity="0.95"/>
      <path d="M32 216 L32 150 L100 104 L150 150 L190 122 L224 156 L224 216 Z" fill="#4c1d95"/>
      <path d="M32 216 L32 196 L80 168 L130 204 L180 176 L224 216 Z" fill="#2e1065"/>
      <g class="box box-b">
        <rect x="52" y="140" width="112" height="60" rx="10" fill="#ffffff" opacity="0.96"/>
        <rect x="66" y="156" width="56" height="8" rx="4" fill="#334155"/>
        <rect x="66" y="172" width="84" height="6" rx="3" fill="#94a3b8"/>
        <rect x="66" y="184" width="66" height="6" rx="3" fill="#94a3b8"/>
      </g>
    </g>
    <g class="scene scene-a">
      <rect x="32" y="40" width="192" height="176" fill="url(#day)"/>
      <circle cx="176" cy="96" r="22" fill="#fef3c7" opacity="0.95"/>
      <path d="M32 216 L32 168 L84 118 L122 156 L154 130 L224 190 L224 216 Z" fill="#0f766e"/>
      <path d="M32 216 L32 190 L70 160 L110 196 L150 170 L224 216 Z" fill="#115e59"/>
      <g class="box box-a">
        <rect x="52" y="140" width="112" height="60" rx="10" fill="#ffffff" opacity="0.96"/>
        <rect x="66" y="156" width="70" height="8" rx="4" fill="#334155"/>
        <rect x="66" y="172" width="84" height="6" rx="3" fill="#94a3b8"/>
        <rect x="66" y="184" width="52" height="6" rx="3" fill="#94a3b8"/>
      </g>
    </g>
  </g>
</svg>
