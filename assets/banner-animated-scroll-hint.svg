<svg xmlns="http://www.w3.org/2000/svg" viewBox="356 522 814 170" width="1350" height="282" role="img" aria-labelledby="title">
  <title id="title">Scroll and follow the story!</title>
  <!-- Second part of banner-animated.svg: the scroll hint alone, without the
       background, in the coordinates of the banner. banner-animated-stage.svg
       holds the first part. -->
  <style>
    /* Scroll hint: the arrow sits on a turning mouse wheel. It comes into view
       at the top, rolls over the front and leaves at the bottom (y = r * sin,
       height = cos of the wheel angle). Four turns per 6s scene loop. */
    .wheel-arrow { animation: wheel-arrow 1.5s linear infinite; }
    @keyframes wheel-arrow {
      0%      { transform: translateY(-75.0px) scaleY(0.001); opacity: 0.00; }
      8.33%   { transform: translateY(-72.4px) scaleY(0.259); opacity: 0.41; }
      16.67%  { transform: translateY(-65.0px) scaleY(0.500); opacity: 0.80; }
      25%     { transform: translateY(-53.0px) scaleY(0.707); opacity: 1.00; }
      33.33%  { transform: translateY(-37.5px) scaleY(0.866); opacity: 1.00; }
      41.67%  { transform: translateY(-19.4px) scaleY(0.966); opacity: 1.00; }
      50%     { transform: translateY(0.0px) scaleY(1.000); opacity: 1.00; }
      58.33%  { transform: translateY(19.4px) scaleY(0.966); opacity: 1.00; }
      66.67%  { transform: translateY(37.5px) scaleY(0.866); opacity: 1.00; }
      75%     { transform: translateY(53.0px) scaleY(0.707); opacity: 1.00; }
      83.33%  { transform: translateY(65.0px) scaleY(0.500); opacity: 0.80; }
      91.67%  { transform: translateY(72.4px) scaleY(0.259); opacity: 0.41; }
      100%    { transform: translateY(75.0px) scaleY(0.001); opacity: 0.00; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wheel-arrow { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="wheel"><rect x="-38" y="-75" width="76" height="150" rx="38"/></clipPath>
  </defs>
